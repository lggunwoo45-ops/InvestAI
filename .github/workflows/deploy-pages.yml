name: Deploy InvestAI to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify configured market relay before publishing
        if: ${{ vars.UPBIT_RELAY_URL != '' }}
        env:
          UPBIT_RELAY_URL: ${{ vars.UPBIT_RELAY_URL }}
          UPBIT_SITE_ORIGIN: https://lggunwoo45-ops.github.io
        run: npm run market:verify --prefix ../backend

      - name: Verify configured news sources before publishing
        if: ${{ vars.NEWS_PROXY_URL != '' }}
        env:
          NEWS_PROXY_URL: ${{ vars.NEWS_PROXY_URL }}
          NEWS_SITE_ORIGIN: https://lggunwoo45-ops.github.io
        run: node ../backend/news/verify-news.mjs

      - name: Build
        env:
          VITE_APP_ENV: production
          VITE_UPBIT_RELAY_URL: ${{ vars.UPBIT_RELAY_URL }}
          VITE_NEWS_PROXY_URL: ${{ vars.NEWS_PROXY_URL }}
        run: npm run build -- --base=/InvestAI/

      - name: Prepare direct-entry routes
        run: node tools/prepare-pages.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
