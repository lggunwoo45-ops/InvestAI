name: Collect official economic calendar

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/calendar-collection.yml'
      - 'backend/research/*Calendar*'
      - 'backend/research/calendar*'

permissions:
  contents: read

jobs:
  verify-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify official BLS calendar access
        run: |
          node --input-type=module <<'NODE'
          import { parseBlsCalendar } from './backend/research/economicCalendar.mjs'
          for (const url of ['https://www.newyorkfed.org/research/calendars/i-nov26.html', 'https://fred.stlouisfed.org/releases/calendar?od=asc&rid=10&ve=2026-12-31&view=year&vs=2026-01-01']) {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(15000) })
              const text = await response.text()
              console.log(JSON.stringify({ url, status: response.status, size: text.length, hasCpi:text.includes('Consumer Price Index') }))
            } catch (error) { console.log(JSON.stringify({url,error:error.name})) }
          }
          NODE
