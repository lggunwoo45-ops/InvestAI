name: Collect official economic calendar

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/calendar-collection.yml'
      - 'backend/research/*Calendar*'
      - 'backend/research/calendar*'

permissions:
  contents: read

jobs:
  verify-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify official BLS calendar access
        run: |
          node --input-type=module <<'NODE'
          import { parseBlsCalendar } from './backend/research/economicCalendar.mjs'
          for (const path of ['schedule/news_release/bls.ics', 'schedule/2026/home.htm', 'schedule/news_release/cpi.htm', 'schedule/2026/11_sched.htm']) {
            try {
              const response = await fetch('https://www.bls.gov/' + path, { redirect: 'error', signal: AbortSignal.timeout(15000) })
              const text = await response.text()
              console.log(JSON.stringify({ path, status: response.status, size: text.length, ...(response.ok && path.endsWith('.ics') ? {upcoming:parseBlsCalendar(text).filter(event => event.at >= Date.now()).length} : {}) }))
            } catch (error) { console.log(JSON.stringify({path,error:error.name})) }
          }
          NODE
