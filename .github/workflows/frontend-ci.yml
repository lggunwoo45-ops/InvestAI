name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  frontend-validation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run proxy tests
        run: npm run test:proxy

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      # Temporary CI quarantine: these two full-app route tests rely on fake timers
      # and daily-snapshot route setup that is unstable on GitHub Actions.
      # Sprint 10.44 should stabilize and restore them to the CI unit-test set.
      - name: Run stable unit tests
        run: |
          TEST_FILES="$(find src -type f \( -name "*.test.ts" -o -name "*.test.tsx" \) ! -path "src/app/App.test.tsx" ! -path "src/pages/MyAnalysis/MyAnalysisPage.test.tsx" | sort | tr '\n' ' ')"
          npm run test -- --maxWorkers=1 $TEST_FILES

      - name: Run production build
        run: npm run build
